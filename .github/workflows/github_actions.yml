name: Deploy to Flash-Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deployer

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: flash-server
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd Development/BackendServer/
            echo "Pulling latest code..."
            git pull origin main

            echo "Installing Python dependencies in virtualenv..."
            /home/flash-server/Development/BackendServer/.venv/bin/pip install --upgrade pip
            /home/flash-server/Development/BackendServer/.venv/bin/pip install -r requirements.txt

            echo "Reloading systemd daemon..."
            /home/flash-server/Services/restart_daemon.sh

            echo "Restarting Gunicorn service..."
            /home/flash-server/Services/Gunicorn/restart_gunicorn_service.sh

            echo "Verifying backend service health..."
            sleep 3
            if systemctl is-active --quiet dev_stepheng753_com_api.service; then
              echo "SUCCESS: dev_stepheng753_com_api.service is active and healthy."
            else
              echo "ERROR: dev_stepheng753_com_api.service failed to restart!" >&2
              systemctl status dev_stepheng753_com_api.service --no-pager
              exit 1
            fi
